[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drone-delivery-decision-engine"
version = "0.1.0"
description = "Flight telemetry payload regression and experimental alert thresholds"
requires-python = ">=3.9"
dependencies = ["pandas>=1.5", "numpy>=1.23", "scikit-learn>=1.2", "matplotlib>=3.6"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
drone-delivery = "drone_delivery.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
